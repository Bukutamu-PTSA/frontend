services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      # Nilai VITE_* ditanam saat build. Setelah mengubahnya, jalankan:
      #   docker compose up -d --build
      args:
        # Kosong = panggil backend lewat origin yang sama (/api), diteruskan
        # Caddy ke BACKEND_URL. Ini mencegah mixed content di halaman HTTPS.
        VITE_API_HOST: ""
        VITE_APP_NAME: "Sistem Pengaduan Tenaga Kerja"
        VITE_APP_SHORT_NAME: "PTSA Kemnaker"
        VITE_ORGANIZATION_NAME: "Kementerian Ketenagakerjaan RI"
        VITE_ORGANIZATION_NAME_SHORT: "Kementerian Ketenagakerjaan"
        VITE_ORGANIZATION_UNIT: "BINWASNAKER & K3"
        VITE_ORGANIZATION_UNIT_FULL: "Ditjen Binwasnaker & K3"
        VITE_DEVELOPER_NAME: "TUBSPK"
        VITE_SYSTEM_OWNER_NAME: "BINSIS"
        VITE_FOOTER_TAGLINE: "Bangga Melayani Bangsa · BerAKHLAK"
        VITE_BRAND_PRIMARY_COLOR: "#032749"
        VITE_BRAND_SECONDARY_COLOR: "#0E3B68"
        VITE_BRAND_ACCENT_COLOR: "#10B981"
        VITE_DEFAULT_TOTAL_LAPORAN: "12450"
        VITE_COPYRIGHT_START_YEAR: "2024"
        VITE_COPYRIGHT_END_YEAR: "2026"
        VITE_ADDRESS_LINE_1: "Jl. Jend. Gatot Subroto Kav. 51"
        VITE_ADDRESS_LINE_2: "RT.5/RW.4, Kuningan Timur, Kecamatan Setiabudi"
        VITE_ADDRESS_LINE_3: "Kota Jakarta Selatan, DKI Jakarta 12950"
        VITE_CONTACT_EMAIL: "pengaduanwlkp@gmail.com"
        VITE_MAPS_URL: "https://maps.app.goo.gl/QiLps9tsVMszzHf79"
        VITE_SOCIAL_X_URL: "https://x.com/KemnakerRI"
        VITE_SOCIAL_FACEBOOK_URL: "https://www.facebook.com/share/1B4YgTmbGG/?mibextid=wwXIfr"
        VITE_SOCIAL_INSTAGRAM_URL: "https://www.instagram.com/kemnaker?stkn=MWdxZjhmMG81aTZ3YQ=="
        VITE_SESSION_TIMEOUT: "3600000"
    # Tidak membuka port ke host; hanya bisa dijangkau Caddy di jaringan internal.
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Host/IP yang dilayani HTTPS, dipisah koma. Ganti IP bila IP komputer
      # server berubah (cek dengan `ipconfig`).
      HTTPS_HOSTS: "localhost, 192.168.158.235"
      # Alamat backend Laravel (tujuan /api dan /storage).
      BACKEND_URL: "http://192.168.156.206:8000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Menyimpan CA lokal & sertifikat agar tidak berganti tiap restart.
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
